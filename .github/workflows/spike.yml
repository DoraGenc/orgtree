name: spike

on:
  push:
    branches: [vrt-status-spike]

permissions:
  checks: write

jobs:
  check-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      VRT_BUILD_URL: https://vrt.example.com/projects/orgtree/builds/42
    steps:
      - name: Create a check run with conclusion action_required
        run: |
          gh api "repos/$REPO/check-runs" \
            -f name="visual-regression" \
            -f head_sha="$SHA" \
            -f status="completed" \
            -f conclusion="action_required" \
            -f details_url="$VRT_BUILD_URL" \
            -f "output[title]=18 differences waiting for approval in VRT" \
            -f "output[summary]=Review the differences in the [VRT build]($VRT_BUILD_URL). This check turns green by itself once every difference is approved." \
            -f "actions[][label]=Open in VRT" \
            -f "actions[][description]=Open the VRT build" \
            -f "actions[][identifier]=open_vrt" \
            --jq '{id, conclusion, details_url}'
